[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcompile-bench"
version = "0.1.0"
description = "One benchmark that tests everything an agent compiler claims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentcompile>=0.3,<0.4",
    "httpx>=0.25",
    "openai>=1.40",
]

[project.optional-dependencies]
# τ-bench (MIT) is installed at a pinned commit, never vendored: we use its data, tools, policy
# and tasks, and run our own agent loop, customer and scoring around them.
tau = ["tau_bench @ git+https://github.com/sierra-research/tau-bench@59a200c6d575d595120f1cb70fea53cef0632f6b"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
acbench = "acbench.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
